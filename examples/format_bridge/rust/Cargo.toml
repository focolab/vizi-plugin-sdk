[package]
name = "format-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
vizi = { package = "vizi-doorbell", path = "../../../polyglot/rust-sdk" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
crc32fast = "1.5"
tempfile = "3"

[profile.dev]
opt-level = 1

[package]
name = "vizi-doorbell"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Specification-based Rust SDK for Vizi protocol 1.x plugins"
include = ["src/**", "examples/**", "proto/**", "build.rs", "Cargo.toml", "Cargo.lock", "README.md", "DOORBELL.md", "WINDOWS.md"]

[features]
default = ["install"]
install = ["dep:tempfile", "dep:sha2"]

[dependencies]
crc32fast = "1.5"
prost = "0.13"
prost-reflect = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tempfile = { version = "3", optional = true }
url = "2"
sha2 = { version = "0.10", optional = true }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.4", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Memory"] }

[[example]]
name = "command_plugin"
required-features = ["install"]

[[example]]
name = "processing_stage"
required-features = ["install"]
